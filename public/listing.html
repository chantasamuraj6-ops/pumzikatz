<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PumzikaTZ — Listing Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="simple">
        <h1><a href="/">PumzikaTZ 🌴</a></h1>
    </header>

    <main>
        <div class="detail-layout">
            <div id="listing-detail"></div>

            <div class="booking-box">
                <h3>Book Your Stay</h3>
                <form id="booking-form">
                    <label for="check_in">Check-in</label>
                    <input type="date" id="check_in" required>

                    <label for="check_out">Check-out</label>
                    <input type="date" id="check_out" required>

                    <label for="guest_name">Full Name</label>
                    <input type="text" id="guest_name" required>

                    <label for="guest_email">Email</label>
                    <input type="email" id="guest_email" required>

                    <p id="total-price"></p>

                    <button type="submit">Book Now</button>
                </form>
                <p id="booking-message"></p>
            </div>
        </div>
    </main>

    <script src="listing.js"></script>
</body>
</html>
