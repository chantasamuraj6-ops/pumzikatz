<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PumzikaTZ — Find Your Stay in Tanzania</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <nav class="site-nav">
            <a href="/" aria-label="PumzikaTZ home">
                <svg class="logo-mark" viewBox="0 0 340 80" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18,68 C18,45 24,28 34,16" stroke="#5B2333" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <path d="M62,68 C62,45 56,28 46,16" stroke="#5B2333" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <circle class="logo-sun" cx="40" cy="19" r="8" fill="#FF6B4A"/>
                    <path d="M25,45 Q40,62 55,45" stroke="#5B2333" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M29,46 L35,39 L41,47 L47,39 L51,46" stroke="#FF6B4A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <text x="90" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#5B2333">Pumzika<tspan fill="#FF6B4A">TZ</tspan></text>
                </svg>
            </a>
        </nav>
        <div class="hero-copy">
            <div class="eyebrow fade-in" style="animation-delay: 0.05s;">HOTELS · LODGES · AIRBNBS</div>
            <h1 class="fade-in" style="animation-delay: 0.15s;">Pumzika popote Tanzania.</h1>
            <p class="fade-in" style="animation-delay: 0.3s;">Rest anywhere in Tanzania — from Zanzibar's beaches to the Serengeti's plains.</p>
        </div>
    </header>

    <div class="filter-bar fade-in" style="animation-delay: 0.45s;">
        <input type="text" id="search-input" placeholder="Search by name or location...">
        <select id="location-filter">
            <option value="">All locations</option>
        </select>
        <select id="type-filter">
            <option value="">All types</option>
            <option value="Hotel">Hotel</option>
            <option value="Lodge">Lodge</option>
            <option value="Airbnb">Airbnb</option>
            <option value="Guesthouse">Guesthouse</option>
        </select>
    </div>

    <main>
        <p class="results-count" id="results-count"></p>
        <div id="listings" class="listings-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
